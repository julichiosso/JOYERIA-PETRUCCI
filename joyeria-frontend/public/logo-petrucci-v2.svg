<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="360" height="330" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Petrucci — Joyería y Relojería</title>

  <!--
    Marca: una sola línea continua —
    sube en zigzag (dos picos tipo montaña) y el segundo pico
    se convierte en el lado izquierdo de una pirámide/triángulo
    abierto (baja por la derecha y cierra con una base parcial
    que no llega a tocar el otro extremo, tal cual el original).
  -->
  <polyline
    points="81,116 126,88 178,181 250,48 291,105 210,105"
    fill="none"
    stroke="#141414"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="miter"
  />

  <!-- Wordmark -->
  <text
    x="180"
    y="255"
    text-anchor="middle"
    font-family="'Cormorant', 'EB Garamond', 'Times New Roman', serif"
    font-size="72"
    fill="#141414"
  >
    Petrucci
  </text>

  <!-- Subtítulo -->
  <text
    x="180"
    y="305"
    text-anchor="middle"
    font-family="'Public Sans', Arial, sans-serif"
    font-size="15"
    letter-spacing="3.5"
    fill="#141414"
  >
    JOYERIA Y RELOJERÍA
  </text>
</svg>
